name: JoysList CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------
  # Frontend Build & Lint Verification
  # ----------------------------------------------------
  frontend-ci:
    name: Frontend Lint & TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd services/frontend
          npm ci

      - name: Verify Frontend TypeScript Build
        run: |
          cd services/frontend
          npm run build

  # ----------------------------------------------------
  # Backend Services Build & Test Matrix
  # ----------------------------------------------------
  backend-ci:
    name: Backend Build & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [listing-service, user-service, notification-service, api-gateway]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Unit Tests for ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          mvn clean test
