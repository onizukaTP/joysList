# ==================================================
# listing-service — Base Configuration
# Shared across all profiles.
# Profile-specific files override values here.
# ==================================================

spring.application.name=listing-service
server.port=8081

# ==================================================
# JPA / Hibernate
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==================================================
# Kafka — Producer
# ==================================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ==================================================
# Kafka — Consumer
# ==================================================
spring.kafka.consumer.group-id=joyslist-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ==================================================
# Kafka — Admin
# ==================================================
spring.kafka.admin.auto-create=true
spring.kafka.admin.fail-fast=true

# ==================================================
# Seeded Admin
# ==================================================
app.admin.email=admin@joyslist.com
app.admin.username=admin

# ==================================================
# Logging & Actuator
# ==================================================
logging.level.root=INFO
logging.level.com.tpdev.joysList=INFO

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always