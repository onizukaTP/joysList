# App Info
spring.application.name=joysList

# PostgreSQL DB Config
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/joyslist_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:8459}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA /Hibernate Config
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=${DB_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT secret key
jwt.secret=${JWT_SECRET_KEY:QWERTYUIOPASDFGHJKLZXCVBNM1234567890abcdefABCDEFGH}

# App logs
logging.level.root=INFO

# Your project logs
logging.level.com.tpdev.joysList=INFO

# Spring Security logs
logging.level.org.springframework.security=DEBUG

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer
spring.kafka.consumer.group-id=joyslist-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Optional: trust package for JSON deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Optional: auto-create topics (depends on broker config)
spring.kafka.admin.auto-create=true