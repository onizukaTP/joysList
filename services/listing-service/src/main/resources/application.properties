# App Info
spring.application.name=joysList

# PostgreSQL DB Config
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/joyslist_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA /Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=${DB_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT secret key
jwt.secret=${JWT_SECRET_KEY}

# App logs
logging.level.root=INFO

# Your project logs
logging.level.com.tpdev.joysList=INFO

# Spring Security logs
logging.level.org.springframework.security=DEBUG