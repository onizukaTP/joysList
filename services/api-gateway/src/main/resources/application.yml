server:
  port:8080

spring:
  cloud:
    gateway:
      routes:

        - id: user-service
          uri: http://user-service:8083
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        - id: listing-service
          uri: http://listing-service:8081
          predicates:
            - Path=/api/v1/categories/**, /api/v1/subcategories/**, /api/v1/ads/**, /api/v1/search/**

        - id: notification-service
          uri: http://notification-service:8082
          predicates:
              - Path=/test/**
