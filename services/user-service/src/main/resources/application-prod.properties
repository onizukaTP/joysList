# ==================================================
# user-service — Prod Profile
# Activate with: -Dspring.profiles.active=prod
# ==================================================

# ==================================================
# PostgreSQL — Docker Environment Database Config
# ==================================================
spring.datasource.url=jdbc:postgresql://postgres:5432/${USERSERVICE_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================================================
# Redis — refresh token store
# ==================================================
spring.data.redis.host=redis
spring.data.redis.port=6379

# ==================================================
# Kafka
# ==================================================
spring.kafka.bootstrap-servers=kafka:9092

# ==================================================
# Security
# ==================================================
jwt.secret=${JWT_SECRET_KEY}

# ==================================================
# Admin seeder
# ==================================================
app.admin.email=admin@joyslist.com
app.admin.username=admin
app.admin.password=${ADMIN_PASSWORD}

# ==================================================
# AWS S3 (populated from Docker env variables)
# ==================================================
aws.s3.bucket=${AWS_S3_BUCKET_NAME}
aws.s3.region=${AWS_S3_REGION}
aws.accessKeyId=${AWS_ACCESS_KEY}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}
