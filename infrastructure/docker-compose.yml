# ==================================================
# JoysList — Full Stack
# Runs all infrastructure + all microservices.
# Use this for end-to-end testing and demos.
#
# Usage:
#   docker compose up -d
#   docker compose up --build -d   (after code changes)
# ==================================================

services:

  # ==================================================
  # PostgreSQL
  # ==================================================
  postgres:
    image: postgres:17-alpine
    container_name: joyslist-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_DB},${USERSERVICE_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  # ==================================================
  # Redis
  # ==================================================
  redis:
    image: redis:7-alpine
    container_name: joyslist-redis

    ports:
      - "6379:6379"

    restart: unless-stopped

  # ==================================================
  # Kafka (KRaft mode — no ZooKeeper)
  # ==================================================
  kafka:
    image: apache/kafka:latest
    container_name: joyslist-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    restart: unless-stopped

  # ==================================================
  # Microservices
  # ==================================================
  listing-service:
    build:
      context: ../services/listing-service

    container_name: joyslist-listing-service

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

    ports:
      - "8081:8081"

    environment:
      SPRING_PROFILES_ACTIVE: prod

      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    restart: unless-stopped

  user-service:
    build:
      context: ../services/user-service

    container_name: joyslist-user-service

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

    ports:
      - "8083:8083"

    environment:
      SPRING_PROFILES_ACTIVE: prod

      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${USERSERVICE_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      USERSERVICE_DB: ${USERSERVICE_DB}

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # AWS Credentials
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      AWS_S3_REGION: ${AWS_S3_REGION}

    restart: unless-stopped

  notification-service:
    build:
      context: ../services/notification-service

    container_name: joyslist-notification-service

    dns:
      - 8.8.8.8
      - 1.1.1.1

    depends_on:
      kafka:
        condition: service_started

    ports:
      - "8082:8082"

    environment:
      SPRING_PROFILES_ACTIVE: prod

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Email
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

    restart: unless-stopped

  api-gateway:
    build:
      context: ../services/api-gateway

    container_name: joyslist-api-gateway

    depends_on:
      - listing-service
      - user-service
      - notification-service

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod

    restart: unless-stopped

volumes:
  postgres_data: