# ==================================================
# JoysList — Infrastructure Only
# Use this during local development to run backing
# services while running Spring Boot apps in your IDE.
#
# Usage:
#   docker compose -f docker-compose.infra.yml up -d
# ==================================================

services:

  # ==================================================
  # PostgreSQL
  # ==================================================
  postgres:
    image: postgres:17-alpine
    container_name: joyslist-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  # ==================================================
  # Redis
  # ==================================================
  redis:
    image: redis:7-alpine
    container_name: joyslist-redis

    ports:
      - "6379:6379"

    restart: unless-stopped

  # ==================================================
  # Kafka (KRaft mode — no ZooKeeper)
  # ==================================================
  kafka:
    image: apache/kafka:latest
    container_name: joyslist-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    restart: unless-stopped

volumes:
  postgres_data: