version: '3.8'
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: joyslist_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "8459"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/joyslist_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "8459"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
